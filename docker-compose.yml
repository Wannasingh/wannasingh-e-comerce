# =============================================================================
# docker-compose.yml — Local Development Environment
# Services: frontend (Astro), backend (MedusaJS), mongo (replica set),
#           mongo-init (RS initializer), sonarqube (optional QA)
# =============================================================================

name: wannasingh-ecommerce

# ── Shared network ─────────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes: {}


# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── Redis (enables pub/sub & job queues) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wannasingh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network

  # ── MedusaJS Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: builder     # Use builder stage in dev for faster iteration
    container_name: wannasingh-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-production
      COOKIE_SECRET: dev-cookie-secret-change-in-production
      MEDUSA_BACKEND_URL: http://localhost:9000
      STORE_CORS: http://localhost:4321
      ADMIN_CORS: http://localhost:7001
      AUTH_CORS: http://localhost:4321,http://localhost:7001
      DISABLE_MEDUSA_ADMIN: "false"
      TNS_ADMIN: /oracle-wallet
      ORACLE_CONNECTION_STRING: ${ORACLE_CONNECTION_STRING}
      ORACLE_USER: ${ORACLE_USER}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
    volumes:
      # Mount source for hot-reload in dev
      - ./apps/backend/src:/app/src
      - ./apps/backend/medusa-config.ts:/app/medusa-config.ts:ro
      - ${TNS_ADMIN:-/Users/haru/oracle-26-ai/APPSDB/Wallet_APPSDB/}:/oracle-wallet:ro
    ports:
      - "9000:9000"
      - "7001:7001"   # Medusa Admin dashboard
    networks:
      - app-network
    command: ["node", "server/index.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Astro Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: builder   # Builder stage in dev
      args:
        PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
        PUBLIC_SITE_URL: http://localhost:4321
    container_name: wannasingh-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PUBLIC_MEDUSA_BACKEND_URL: http://backend:9000
      PUBLIC_SITE_URL: http://localhost:4321
    volumes:
      # Hot-reload source mount for Astro dev server
      - ./apps/frontend/src:/app/src
      - ./apps/frontend/public:/app/public:ro
    ports:
      - "4321:4321"
    networks:
      - app-network
    command: ["node", "./dist/server/entry.mjs"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

