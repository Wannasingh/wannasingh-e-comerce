# =============================================================================
# SonarQube — Project Configuration
# https://docs.sonarqube.org/latest/analysis/analysis-parameters/
# =============================================================================

# ─── Project Identity ────────────────────────────────────────────────────────
sonar.projectKey=Wannasingh_wannasingh-e-comerce_aac2cf9b-2060-45fe-88af-4ab0a52c03d9
sonar.projectName=wannasingh-e-comerce
sonar.projectVersion=1.1.0
sonar.organization=Wannasingh

# ─── Sources ─────────────────────────────────────────────────────────────────
sonar.sources=apps/frontend/src,apps/backend/src
sonar.tests=apps/frontend/src,apps/backend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# ─── Language ────────────────────────────────────────────────────────────────
sonar.language=ts

# ─── TypeScript / JavaScript ─────────────────────────────────────────────────
sonar.javascript.lcov.reportPaths=apps/frontend/coverage/lcov.info,apps/backend/coverage/lcov.info
sonar.typescript.tsconfigPath=apps/frontend/tsconfig.json,apps/backend/tsconfig.json

# ─── Exclusions ──────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.astro/**,\
  **/.medusa/**,\
  **/*.min.js,\
  **/*.d.ts,\
  **/coverage/**,\
  **/*.config.{mjs,cjs,js,ts},\
  **/public/**

sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,\
  apps/backend/src/scripts/seed.ts,\
  apps/backend/src/api/store/admin-api/customers/[id]/approve-seller/route.ts,\
  apps/backend/src/api/store/admin-api/customers/[id]/reject-seller/route.ts

# ─── Quality Gate ────────────────────────────────────────────────────────────
# Enforced via SonarQube Quality Gate — requires >= 80% coverage on new code
sonar.qualitygate.wait=true

# ─── Encoding ────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ─── SCM ─────────────────────────────────────────────────────────────────────
sonar.scm.provider=git
