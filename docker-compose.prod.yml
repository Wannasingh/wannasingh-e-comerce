# =============================================================================
# docker-compose.prod.yml — Production Self-Hosted Deployment
# =============================================================================

name: wannasingh-e-commerce

networks:
  app-network:
    driver: bridge

volumes: {}

services:
  # ── Redis (enables pub/sub & job queues) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wannasingh-e-commerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network

  # ── MedusaJS Backend ──────────────────────────────────────────────────────
  backend:
    image: ${REGISTRY}/wannasingh-e-commerce-backend:${IMAGE_TAG:-latest}
    container_name: wannasingh-e-commerce-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      MEDUSA_BACKEND_URL: https://e-commerce-api.wannasingh.dev
      STORE_CORS: https://e-commerce.wannasingh.dev,http://e-commerce.wannasingh.dev
      ADMIN_CORS: https://admin-e-commerce.wannasingh.dev,http://admin-e-commerce.wannasingh.dev
      AUTH_CORS: https://e-commerce.wannasingh.dev,http://e-commerce.wannasingh.dev,https://admin-e-commerce.wannasingh.dev,http://admin-e-commerce.wannasingh.dev
      DISABLE_MEDUSA_ADMIN: "false"
      TNS_ADMIN: /oracle-wallet
      ORACLE_CONNECTION_STRING: ${ORACLE_CONNECTION_STRING}
      ORACLE_USER: ${ORACLE_USER}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
    volumes:
      - ${TNS_ADMIN:-/Users/haru/oracle-26-ai/APPSDB/Wallet_APPSDB/}:/oracle-wallet:ro
    ports:
      - "9000:9000"
      - "7001:7001"   # Medusa Admin dashboard
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Astro Frontend ────────────────────────────────────────────────────────
  frontend:
    image: ${REGISTRY}/wannasingh-e-commerce-frontend:${IMAGE_TAG:-latest}
    container_name: wannasingh-e-commerce-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PUBLIC_MEDUSA_BACKEND_URL: https://e-commerce-api.wannasingh.dev
      PUBLIC_SITE_URL: https://e-commerce.wannasingh.dev
    ports:
      - "4321:4321"
    networks:
      - app-network
    command: ["node", "./dist/server/entry.mjs"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
